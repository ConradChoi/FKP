# Design Ref: §2.2 Data Flow (5), §11.1 File Structure — AWS Amplify Hosting (Next.js SSR / Web Compute)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
