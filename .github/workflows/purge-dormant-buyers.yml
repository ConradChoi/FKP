# 휴면 후 1년 경과로 삭제된 SEEPN 회원의 로그인 계정(auth.users) 정리.
# app/api/cron/purge-dormant-buyers/route.ts 를 하루 한 번 호출한다(purge-partner-documents와 같은 시크릿).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   PARTNER_APP_SITE_URL           e.g. https://findkoreanpartners.com
#   PARTNER_DOC_PURGE_CRON_SECRET  same value as the Amplify env var of the
#                                   same name (PARTNER_DOC_PURGE_CRON_SECRET,
#                                   server-only — no NEXT_PUBLIC_ prefix)
name: Purge dormant buyers

on:
  schedule:
    # 매일 18:30 UTC(03:30 KST). run_daily_retention_batches()가 데이터를 삭제한 뒤 실행되면 충분하다.
    - cron: '30 18 * * *'
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call purge-dormant-buyers endpoint
        env:
          SITE_URL: ${{ secrets.PARTNER_APP_SITE_URL }}
          CRON_SECRET: ${{ secrets.PARTNER_DOC_PURGE_CRON_SECRET }}
        run: |
          status=$(curl -s -o /tmp/response.json -w '%{http_code}' -X POST \
            "${SITE_URL}/api/cron/purge-dormant-buyers" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP status: ${status}"
          cat /tmp/response.json
          if [ "${status}" -ge 300 ]; then
            echo "purge-dormant-buyers returned HTTP ${status}"
            exit 1
          fi
