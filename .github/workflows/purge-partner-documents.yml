# Design Ref: docs/03-security/partner-supplier-app-ui-privacy-review.md §5.1
# (UI-B5). Trigger for app/api/cron/purge-partner-documents/route.ts — see that
# route's own header comment for why a GitHub Actions schedule (rather than new
# AWS infrastructure) was chosen for this project's Amplify Hosting deployment.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   PARTNER_APP_SITE_URL           e.g. https://findkoreanpartners.com
#   PARTNER_DOC_PURGE_CRON_SECRET  same value as the Amplify env var of the
#                                   same name (PARTNER_DOC_PURGE_CRON_SECRET,
#                                   server-only — no NEXT_PUBLIC_ prefix)
name: Purge partner documents

on:
  schedule:
    # Every 15 minutes. Frequent enough that a partner's "탈퇴 후 Storage 객체가
    # 실제로 존재하지 않음" (P1 DoD gate) is true within minutes, not hours.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call purge-partner-documents endpoint
        env:
          SITE_URL: ${{ secrets.PARTNER_APP_SITE_URL }}
          CRON_SECRET: ${{ secrets.PARTNER_DOC_PURGE_CRON_SECRET }}
        run: |
          status=$(curl -s -o /tmp/response.json -w '%{http_code}' -X POST \
            "${SITE_URL}/api/cron/purge-partner-documents" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP status: ${status}"
          cat /tmp/response.json
          if [ "${status}" -ge 300 ]; then
            echo "purge-partner-documents returned HTTP ${status}"
            exit 1
          fi
